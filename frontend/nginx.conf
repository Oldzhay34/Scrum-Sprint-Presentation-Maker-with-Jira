server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Frontend ve backend Railway'de FARKLI subdomain'lerde (ayri "site" sayiliyor,
    # bkz. PSL) yayinlaniyor - taraycilarin 3rd-party cookie engellemesi cross-site
    # fetch/XHR isteklerinde auth/CSRF cookie'lerini SESSIZCE gonderMEZ (Set-Cookie
    # de kaydedilmeyebilir). Cozum: API isteklerini ayni origin (bu nginx) uzerinden
    # backend'e proxy'lemek - boylece tarayci acisindan cookie'ler HER ZAMAN
    # first-party/same-site olur, 3rd-party cookie politikasi hic devreye girmez.
    # BACKEND_INTERNAL_URL env degiskeni docker-entrypoint.sh tarafindan bu dosyaya
    # (container baslarken) enjekte edilir - Railway'in private network hostname'i
    # build-time'da bilinmedigi icin burada literal deger yazilamaz.
    location /api/ {
        proxy_pass ${BACKEND_INTERNAL_URL}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path /api /api;
    }

    # Vite build ciktisi hash'li dosya adlari uretir (orn. index-B_glDFOg.js) -
    # bu yuzden /assets/ altindakiler agresif cache'lenebilir, icerik degisince
    # zaten yeni bir dosya adi gelir. index.html ise HER ZAMAN son build'in
    # hangi hash'li dosyalari kullandigini soyler - o yuzden index.html'in
    # tarayicida asla cache'lenmemesi gerekir, yoksa yeni deploy sonrasi
    # kullanicilar eski JS/CSS'i cagirmaya devam eder (bkz. gorulen sorun).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri $uri/ /index.html;
    }
}
