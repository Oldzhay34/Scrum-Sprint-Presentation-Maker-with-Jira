# Odyssey dis kabugu + kimlik dogrulama servisi - YEREL calistirma icin.
#
# Bu iki proje ayri klasorlerde duruyor (C:\Users\40538\Downloads). Ana
# docker-compose.yml ile BIRLIKTE kullanilir, boylece hepsi ayni agda olur:
#
#   docker compose -f docker-compose.yml -f docker-compose.odyssey.yml up -d
#
# Giris adresi: http://localhost:4173 (Odyssey kabugu). Capacity Planner
# arayuzu kabugun icinde /kapasite/ altindan servis edilir.

services:
  # Kabuk kendi origin'inden servis ettigi icin Capacity Planner arayuzu
  # /kapasite/ onekiyle derlenmeli ve API cagrilarini GORECELI yapmali
  # (bos VITE_API_BASE_URL) - boylece istekler kabugun nginx'ine dusup
  # oturum cerezi first-party kalir.
  frontend:
    build:
      args:
        VITE_BASE_PATH: /kapasite/
        VITE_API_BASE_URL: ""
        VITE_ODYSSEY_URL: /

  odyssey-auth:
    build:
      context: ../Downloads/odyssey-auth
      dockerfile: Dockerfile
    container_name: odyssey-auth
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: odyssey_auth
      DB_USERNAME: ${DB_USERNAME:-capacity_planner}
      DB_PASSWORD: ${DB_PASSWORD:-capacity_planner}
      # Capacity Planner backend'i token'i AYNI sirla dogruluyor.
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET .env icinde tanimlanmali}
      APP_JWT_COOKIE_SECURE: "false"
      APP_JWT_SAME_SITE: Lax
      APP_CORS_ALLOWED_ORIGINS: http://localhost:4173,http://localhost:5173
    ports:
      - "${ODYSSEY_AUTH_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy

  odyssey-shell:
    build:
      context: "../Downloads/Landing Page"
      dockerfile: Dockerfile
    container_name: odyssey-shell
    restart: unless-stopped
    volumes:
      # Imajdaki Railway sablonu yerine yerel (http + servis adi) surum.
      - ./local/odyssey-shell.nginx.conf:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${ODYSSEY_SHELL_PORT:-4173}:80"
    depends_on:
      - odyssey-auth
      - backend
      - frontend
