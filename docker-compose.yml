services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: capacity-planner-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-CapacityPlanner!2024}
      MSSQL_PID: Developer
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - capacity-planner-mssql-data:/var/opt/mssql
    healthcheck:
      # SQL Server 2022 imaji mssql-tools18 kullanir (eskisi mssql-tools); -C
      # sunucu sertifikasini dogrulamadan guvenir (yerel/dev icin yeterli).
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: capacity-planner-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: capacity-planner-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-capacity_planner}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-capacity_planner}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # pgadmin kaldirildi (Postgres'e ozgu bir yonetim araciydi). MSSQL icin
  # container'lastirilmis basit bir GUI karsiligi yok - yerelde Azure Data
  # Studio veya SSMS ile localhost:${DB_PORT:-1433} (sa / MSSQL_SA_PASSWORD)
  # uzerinden baglanilabilir.

  minio:
    image: minio/minio:latest
    container_name: capacity-planner-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-capacity_planner}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-capacity_planner}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - capacity-planner-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capacity-planner-backend
    restart: unless-stopped
    environment:
      DB_HOST: mssql
      DB_PORT: 1433
      DB_NAME: ${DB_NAME:-capacity_planner}
      DB_USERNAME: ${DB_USERNAME:-sa}
      DB_PASSWORD: ${DB_PASSWORD:-CapacityPlanner!2024}
      DB_ENCRYPT: ${DB_ENCRYPT:-true}
      DB_TRUST_SERVER_CERTIFICATE: ${DB_TRUST_SERVER_CERTIFICATE:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-capacity_planner}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-capacity_planner}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-capacity_planner}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-capacity_planner}
      MINIO_BUCKET: ${MINIO_BUCKET:-capacity-planner-assets}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: capacity-planner-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  capacity-planner-mssql-data:
  capacity-planner-minio-data:
